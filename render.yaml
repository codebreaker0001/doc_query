services:
  - type: web
    name: repo-qa-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_EMBEDDED_WORKER
        value: "true"
